<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Hexagon background -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" 
           fill="none" 
           stroke="url(#faviconGradient)" 
           stroke-width="1.5"/>
  
  <!-- AI Brain -->
  <g fill="url(#faviconGradient)">
    <circle cx="16" cy="14" r="3"/>
    <line x1="16" y1="14" x2="10" y2="10" stroke="url(#faviconGradient)" stroke-width="1"/>
    <line x1="16" y1="14" x2="22" y2="10" stroke="url(#faviconGradient)" stroke-width="1"/>
    <line x1="16" y1="14" x2="10" y2="18" stroke="url(#faviconGradient)" stroke-width="1"/>
    <line x1="16" y1="14" x2="22" y2="18" stroke="url(#faviconGradient)" stroke-width="1"/>
    <circle cx="10" cy="10" r="1.5"/>
    <circle cx="22" cy="10" r="1.5"/>
    <circle cx="10" cy="18" r="1.5"/>
    <circle cx="22" cy="18" r="1.5"/>
  </g>
  
  <!-- XW -->
  <text x="16" y="26" 
        text-anchor="middle" 
        font-family="Arial" 
        font-size="5" 
        font-weight="bold"
        fill="url(#faviconGradient)">XW</text>
</svg>
