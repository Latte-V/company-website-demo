<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background hexagon -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" 
           fill="none" 
           stroke="url(#logoGradient)" 
           stroke-width="3"
           filter="url(#glow)"/>
  
  <!-- AI Brain Circuit Pattern -->
  <g fill="url(#logoGradient)" filter="url(#glow)">
    <!-- Central AI node -->
    <circle cx="50" cy="45" r="8"/>
    
    <!-- Neural connections -->
    <line x1="50" y1="45" x2="30" y2="30" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="50" y1="45" x2="70" y2="30" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="50" y1="45" x2="30" y2="60" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="50" y1="45" x2="70" y2="60" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="50" y1="45" x2="50" y2="25" stroke="url(#logoGradient)" stroke-width="2"/>
    
    <!-- Outer nodes -->
    <circle cx="30" cy="30" r="4"/>
    <circle cx="70" cy="30" r="4"/>
    <circle cx="30" cy="60" r="4"/>
    <circle cx="70" cy="60" r="4"/>
    <circle cx="50" cy="25" r="4"/>
    
    <!-- Bottom accent -->
    <path d="M35 75 Q50 85 65 75" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  </g>
  
  <!-- XW text -->
  <text x="50" y="82" 
        text-anchor="middle" 
        font-family="Arial Black, sans-serif" 
        font-size="12" 
        font-weight="bold"
        fill="url(#logoGradient)">XW</text>
</svg>
